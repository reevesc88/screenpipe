# Screenpipe Toolchain

## Action

Use `cargo` for Rust and `bun` for JS/TS. Do not use npm or pnpm. Add the screenpipe source header from CLAUDE.md to every source file you create or edit.

## Evidence

- CLAUDE.md package manager and file-header rules
- Workspace `Cargo.toml` plus `apps/screenpipe-app-tauri` bun scripts

