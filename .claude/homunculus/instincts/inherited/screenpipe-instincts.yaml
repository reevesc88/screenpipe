# Screenpipe Commit Message

## Action

Write an imperative, present-tense subject of at most 72 characters. Commit text feeds the changelog, so the subject must say what changed. Do not restrict prefixes to `chore`, and do not require `feat:` or `fix:` conventional-commit prefixes.

## Evidence

- CONTRIBUTING.md styleguide: present tense, imperative mood, 72-character first line
- Changelog is generated from commit history

