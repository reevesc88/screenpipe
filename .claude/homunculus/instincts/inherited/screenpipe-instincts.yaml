# Screenpipe Test Placement

## Action

Match the test location already used by the surrounding code. TypeScript tests are colocated `*.test.ts` / `*.test.tsx`, with some existing `__tests__` directories. Rust unit tests are in-file `mod tests`. Rust integration tests live in `crates/<crate>/tests/`. Do not require a separate `tests/` or `__tests__` tree that mirrors `src`. Run `cargo test` or `bun test`.

## Evidence

- Colocated `*.test.ts(x)` under the Tauri app
- `mod tests` inside Rust modules
- `crates/*/tests/` integration tests
