# Screenpipe Import Alias

## Action

In the Tauri app, import project files with `@/` and `@ee/*` (`import { cn } from "@/lib/utils"`). Do not introduce relative PascalCase paths. Packages without those `paths` entries keep the relative imports already used there.

## Evidence

- `apps/screenpipe-app-tauri/tsconfig.json` maps `@/*` to `./*` and `@ee/*` to `../../ee/desktop/*`
- App imports are mostly `@/`; `@ee/` is used for enterprise desktop modules

