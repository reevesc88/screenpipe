# Screenpipe Naming Files

## Action

Name TypeScript files in kebab-case (`components/ui/button.tsx`, `license-key-input.tsx`). Name Rust modules in snake_case (`meeting_watcher.rs`). Do not use PascalCase file names.

## Evidence

- TS/TSX tree is kebab-case; no PascalCase `.ts`/`.tsx` filenames
- Rust sources use snake_case module files

